name: Gate 17 minimal FFmpeg build proof

on:
  pull_request:
    paths:
      - ".github/workflows/gate17-minimal-ffmpeg-build.yml"
      - "third_party/ffmpeg-lgpl-candidate/SOURCE-CONTRACT.json"
      - "reconstruction/gate17_ffmpeg_minimal_source_contract.py"
      - "reconstruction/gate17_ffmpeg_minimal_build_audit.py"
      - "reconstruction/test_gate17_ffmpeg_minimal_build_audit.py"
      - "reconstruction/gate17_ffmpeg_toolchain_provenance.py"
      - "reconstruction/test_gate17_ffmpeg_toolchain_provenance.py"
      - "third_party/ffmpeg-lgpl-candidate/TOOLCHAIN-CONTRACT.json"
      - "third_party/ffmpeg-lgpl-candidate/TOOLCHAIN-PACKAGES.lock"
      - "research/GATE17_MINIMAL_FFMPEG_TOOLCHAIN.md"
      - "reconstruction/gate17_ffmpeg_minimal_roundtrip.py"
      - "reconstruction/test_gate17_ffmpeg_minimal_roundtrip.py"
      - "research/GATE17_MINIMAL_FFMPEG_ROUNDTRIP.md"
  workflow_dispatch:

concurrency:
  group: gate17-minimal-ffmpeg-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-proof:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Preserve LF line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - name: Check out exact port candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Audit source contract and materialize configure args
        shell: pwsh
        run: |
          python -c "from reconstruction.gate17_ffmpeg_minimal_source_contract import audit_source_contract; import json; print(json.dumps(audit_source_contract('.'), indent=2, sort_keys=True))"
          python -c "import json,pathlib; p=json.loads(pathlib.Path('third_party/ffmpeg-lgpl-candidate/SOURCE-CONTRACT.json').read_text(encoding='utf-8')); pathlib.Path('_minimal-ffmpeg-configure.args').write_text('\n'.join(p['minimal_helper_target']['configure_args'])+'\n', encoding='utf-8', newline='\n')"

      - name: Check out pinned FFmpeg source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FFmpeg/FFmpeg
          ref: 46d8f462eeb87ee1f704d8c44a0ee24fca471ad1
          path: _ffmpeg-source
          fetch-depth: 1

      - name: Set up native UCRT64 build environment
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            diffutils
            pkgconf
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-nasm

      - name: Capture exact UCRT64 toolchain package inventory
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/_minimal-ffmpeg-build"
          pacman -Q | LC_ALL=C sort > "$GITHUB_WORKSPACE/_minimal-ffmpeg-build/toolchain-packages.txt"

      - name: Audit exact UCRT64 toolchain provenance
        shell: pwsh
        run: |
          python reconstruction/gate17_ffmpeg_toolchain_provenance.py `
            --repo-root "." `
            --package-list "_minimal-ffmpeg-build/toolchain-packages.txt" `
            --output-receipt "_minimal-ffmpeg-build/toolchain-proof.json"

      - name: Build exact minimal FFmpeg helper
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/_ffmpeg-source"
          mapfile -t CONFIGURE_ARGS < <(tr -d '\r' < "$GITHUB_WORKSPACE/_minimal-ffmpeg-configure.args")
          printf 'Pinned configure args:\n'
          printf '  %s\n' "${CONFIGURE_ARGS[@]}"
          ./configure "${CONFIGURE_ARGS[@]}"
          make -j2 ffmpeg.exe ffprobe.exe

          OUT="$GITHUB_WORKSPACE/_minimal-ffmpeg-build"
          mkdir -p "$OUT"
          cp ffmpeg.exe ffprobe.exe COPYING.LGPLv2.1 "$OUT/"
          git rev-parse HEAD | tr -d '\r' > "$OUT/source-commit.txt"
          objdump -p ffmpeg.exe > "$OUT/ffmpeg-objdump.txt"
          objdump -p ffprobe.exe > "$OUT/ffprobe-objdump.txt"
          cp ffbuild/config.mak ffbuild/config.log "$OUT/"

      - name: Audit built helper and write proof receipt
        shell: pwsh
        run: |
          python reconstruction/gate17_ffmpeg_minimal_build_audit.py `
            --repo-root "." `
            --ffmpeg "_minimal-ffmpeg-build/ffmpeg.exe" `
            --ffprobe "_minimal-ffmpeg-build/ffprobe.exe" `
            --source-commit-file "_minimal-ffmpeg-build/source-commit.txt" `
            --source-license-file "_minimal-ffmpeg-build/COPYING.LGPLv2.1" `
            --ffmpeg-imports "_minimal-ffmpeg-build/ffmpeg-objdump.txt" `
            --ffprobe-imports "_minimal-ffmpeg-build/ffprobe-objdump.txt" `
            --output-receipt "_minimal-ffmpeg-build/build-proof.json"

      - name: Prove synthetic canonical startup roundtrip
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-03-18-14/ffmpeg-n9.0.2-22-g46d8f462ee-win64-lgpl-9.0.zip"
          $archive = Join-Path "${{ runner.temp }}" "ffmpeg-lgpl-fixture.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $roundtripArgs = @(
            "reconstruction/gate17_ffmpeg_minimal_roundtrip.py",
            "--repo-root", ".",
            "--ffmpeg", "_minimal-ffmpeg-build/ffmpeg.exe",
            "--ffprobe", "_minimal-ffmpeg-build/ffprobe.exe",
            "--build-proof", "_minimal-ffmpeg-build/build-proof.json",
            "--fixture-archive", $archive,
            "--output-receipt", "_minimal-ffmpeg-build/roundtrip-proof.json"
          )
          python @roundtripArgs

      - name: Upload exact minimal build proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate17-minimal-ffmpeg-build-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            _minimal-ffmpeg-build/ffmpeg.exe
            _minimal-ffmpeg-build/ffprobe.exe
            _minimal-ffmpeg-build/COPYING.LGPLv2.1
            _minimal-ffmpeg-build/source-commit.txt
            _minimal-ffmpeg-build/ffmpeg-objdump.txt
            _minimal-ffmpeg-build/ffprobe-objdump.txt
            _minimal-ffmpeg-build/config.mak
            _minimal-ffmpeg-build/config.log
            _minimal-ffmpeg-build/toolchain-packages.txt
            _minimal-ffmpeg-build/toolchain-proof.json
            _minimal-ffmpeg-build/build-proof.json
            _minimal-ffmpeg-build/roundtrip-proof.json
          if-no-files-found: error
          retention-days: 14
