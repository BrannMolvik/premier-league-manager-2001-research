name: Gate 17 minimal FFmpeg build proof

on:
  pull_request:
    paths:
      - ".github/workflows/gate17-minimal-ffmpeg-build.yml"
      - "third_party/ffmpeg-lgpl-candidate/SOURCE-CONTRACT.json"
      - "reconstruction/gate17_ffmpeg_minimal_source_contract.py"
      - "reconstruction/gate17_ffmpeg_minimal_build_audit.py"
      - "reconstruction/test_gate17_ffmpeg_minimal_build_audit.py"
      - "reconstruction/gate17_ffmpeg_toolchain_provenance.py"
      - "reconstruction/test_gate17_ffmpeg_toolchain_provenance.py"
      - "reconstruction/gate17_ffmpeg_link_trace_audit.py"
      - "reconstruction/test_gate17_ffmpeg_link_trace_audit.py"
      - "reconstruction/gate17_ffmpeg_link_input_ownership_audit.py"
      - "reconstruction/test_gate17_ffmpeg_link_input_ownership_audit.py"
      - "reconstruction/gate17_ffmpeg_link_map_audit.py"
      - "reconstruction/test_gate17_ffmpeg_link_map_audit.py"
      - "third_party/ffmpeg-lgpl-candidate/TOOLCHAIN-CONTRACT.json"
      - "third_party/ffmpeg-lgpl-candidate/TOOLCHAIN-PACKAGES.lock"
      - "research/GATE17_MINIMAL_FFMPEG_TOOLCHAIN.md"
      - "reconstruction/gate17_ffmpeg_minimal_roundtrip.py"
      - "reconstruction/test_gate17_ffmpeg_minimal_roundtrip.py"
      - "research/GATE17_MINIMAL_FFMPEG_ROUNDTRIP.md"
  workflow_dispatch:

concurrency:
  group: gate17-minimal-ffmpeg-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-proof:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Preserve LF line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - name: Check out exact port candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Audit source contract and materialize configure args
        shell: pwsh
        run: |
          python -c "from reconstruction.gate17_ffmpeg_minimal_source_contract import audit_source_contract; import json; print(json.dumps(audit_source_contract('.'), indent=2, sort_keys=True))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import json,pathlib; p=json.loads(pathlib.Path('third_party/ffmpeg-lgpl-candidate/SOURCE-CONTRACT.json').read_text(encoding='utf-8')); pathlib.Path('_minimal-ffmpeg-configure.args').write_text('\n'.join(p['minimal_helper_target']['configure_args'])+'\n', encoding='utf-8', newline='\n')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check out pinned FFmpeg source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FFmpeg/FFmpeg
          ref: 46d8f462eeb87ee1f704d8c44a0ee24fca471ad1
          path: _ffmpeg-source
          fetch-depth: 1

      - name: Set up native UCRT64 build environment
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            diffutils
            pkgconf
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-nasm

      - name: Capture exact UCRT64 toolchain package inventory
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/_minimal-ffmpeg-build"
          pacman -Q | LC_ALL=C sort > "$GITHUB_WORKSPACE/_minimal-ffmpeg-build/toolchain-packages.txt"

      - name: Audit exact UCRT64 toolchain provenance
        shell: pwsh
        run: |
          python reconstruction/gate17_ffmpeg_toolchain_provenance.py `
            --repo-root "." `
            --package-list "_minimal-ffmpeg-build/toolchain-packages.txt" `
            --output-receipt "_minimal-ffmpeg-build/toolchain-proof.json"

      - name: Build exact minimal FFmpeg helper and capture link evidence
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/_ffmpeg-source"
          mapfile -t CONFIGURE_ARGS < <(tr -d '\r' < "$GITHUB_WORKSPACE/_minimal-ffmpeg-configure.args")
          printf 'Pinned configure args:\n'
          printf '  %s\n' "${CONFIGURE_ARGS[@]}"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          if ! [[ "$SOURCE_DATE_EPOCH" =~ ^[0-9]+$ ]]; then
            printf 'Invalid source-derived SOURCE_DATE_EPOCH: %s\n' "$SOURCE_DATE_EPOCH" >&2
            exit 1
          fi
          export SOURCE_DATE_EPOCH
          printf 'Pinned SOURCE_DATE_EPOCH: %s\n' "$SOURCE_DATE_EPOCH"
          ./configure "${CONFIGURE_ARGS[@]}"

          OUT="$GITHUB_WORKSPACE/_minimal-ffmpeg-build"
          mkdir -p "$OUT/release-unstripped"
          make V=1 -j2 ffmpeg.exe ffprobe.exe 2>&1 | tee "$OUT/release-build.log"

          cp ffmpeg.exe ffprobe.exe COPYING.LGPLv2.1 "$OUT/"
          cp ffmpeg_g.exe "$OUT/release-unstripped/ffmpeg_g.exe"
          cp ffprobe_g.exe "$OUT/release-unstripped/ffprobe_g.exe"
          cp ffbuild/config.mak "$OUT/config.mak.release"
          git rev-parse HEAD | tr -d '\r' > "$OUT/source-commit.txt"
          objdump -p ffmpeg.exe > "$OUT/ffmpeg-objdump.txt"
          objdump -p ffprobe.exe > "$OUT/ffprobe-objdump.txt"

          # Evidence-only trace relink. The audit requires the traced command
          # to equal the release command after removing only -Wl,--trace.
          printf '\nLDEXEFLAGS += -Wl,--trace\n' >> ffbuild/config.mak
          rm -f ffmpeg_g.exe
          make V=1 ffmpeg_g.exe 2>&1 | tee "$OUT/ffmpeg-link-trace.log"
          rm -f ffprobe_g.exe
          make V=1 ffprobe_g.exe 2>&1 | tee "$OUT/ffprobe-link-trace.log"
          cp "$OUT/config.mak.release" ffbuild/config.mak

          # Evidence-only map relinks. Each map command differs from the
          # release link only by one -Wl,-Map,<file> flag. The member audit
          # also requires the relinked unstripped executable to be byte-identical
          # to the preserved release unstripped executable.
          printf '\nLDEXEFLAGS += -Wl,-Map,ffmpeg-link.map\n' >> ffbuild/config.mak
          rm -f ffmpeg_g.exe ffmpeg-link.map
          make V=1 ffmpeg_g.exe 2>&1 | tee "$OUT/ffmpeg-link-map-build.log"
          test -s ffmpeg-link.map
          cp ffmpeg-link.map "$OUT/ffmpeg-link.map"
          cp "$OUT/config.mak.release" ffbuild/config.mak

          printf '\nLDEXEFLAGS += -Wl,-Map,ffprobe-link.map\n' >> ffbuild/config.mak
          rm -f ffprobe_g.exe ffprobe-link.map
          make V=1 ffprobe_g.exe 2>&1 | tee "$OUT/ffprobe-link-map-build.log"
          test -s ffprobe-link.map
          cp ffprobe-link.map "$OUT/ffprobe-link.map"
          cp "$OUT/config.mak.release" ffbuild/config.mak
          cp ffbuild/config.mak ffbuild/config.log "$OUT/"

      - name: Audit resolved final-link inputs
        shell: pwsh
        run: |
          python reconstruction/gate17_ffmpeg_link_trace_audit.py `
            --release-build-log "_minimal-ffmpeg-build/release-build.log" `
            --ffmpeg-trace-log "_minimal-ffmpeg-build/ffmpeg-link-trace.log" `
            --ffprobe-trace-log "_minimal-ffmpeg-build/ffprobe-link-trace.log" `
            --output-receipt "_minimal-ffmpeg-build/link-input-proof.json"

      - name: Capture direct package ownership for external final-link inputs
        shell: msys2 {0}
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/_minimal-ffmpeg-build"
          INPUTS="$OUT/external-link-inputs.tsv"
          OWNERS="$OUT/link-input-owners.tsv"
          : > "$INPUTS"

          extract_external_inputs() {
            local target="$1"
            local trace_log="$2"
            sed 's#\\#/#g' "$trace_log" |
              awk -v target="$target" '/^[A-Za-z]:\/.*\.(a|o)$/ { print target "\t" $0 }'
          }

          {
            extract_external_inputs "ffmpeg_g.exe" "$OUT/ffmpeg-link-trace.log"
            extract_external_inputs "ffprobe_g.exe" "$OUT/ffprobe-link-trace.log"
          } | LC_ALL=C sort -u > "$INPUTS"

          test -s "$INPUTS"
          : > "$OWNERS.tmp"
          while IFS="$(printf '\t')" read -r target trace_path; do
            test -n "$target"
            test -n "$trace_path"
            posix_path="$(cygpath -u "$trace_path")"
            normalized_path="$(readlink -f "$posix_path")"
            test -f "$normalized_path"
            owner_package="$(pacman -Qqo "$normalized_path")"
            read -r owner_name owner_version <<< "$(pacman -Q "$owner_package")"
            test "$owner_name" = "$owner_package"
            test -n "$owner_version"
            printf '%s\t%s\t%s\t%s\t%s\n' \
              "$target" "$trace_path" "$normalized_path" "$owner_name" "$owner_version" \
              >> "$OWNERS.tmp"
          done < "$INPUTS"
          LC_ALL=C sort "$OWNERS.tmp" > "$OWNERS"
          rm -f "$OWNERS.tmp"
          test -s "$OWNERS"

      - name: Audit direct package ownership for external final-link inputs
        shell: pwsh
        run: |
          $ownershipArgs = @(
            "reconstruction/gate17_ffmpeg_link_input_ownership_audit.py",
            "--ffmpeg-trace-log", "_minimal-ffmpeg-build/ffmpeg-link-trace.log",
            "--ffprobe-trace-log", "_minimal-ffmpeg-build/ffprobe-link-trace.log",
            "--owner-rows", "_minimal-ffmpeg-build/link-input-owners.tsv",
            "--package-lock", "third_party/ffmpeg-lgpl-candidate/TOOLCHAIN-PACKAGES.lock",
            "--toolchain-contract", "third_party/ffmpeg-lgpl-candidate/TOOLCHAIN-CONTRACT.json",
            "--output-receipt", "_minimal-ffmpeg-build/link-input-ownership-proof.json"
          )
          python @ownershipArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Audit archive-member and direct-object contribution evidence
        shell: pwsh
        run: |
          $memberArgs = @(
            "reconstruction/gate17_ffmpeg_link_map_audit.py",
            "--release-build-log", "_minimal-ffmpeg-build/release-build.log",
            "--ffmpeg-map-build-log", "_minimal-ffmpeg-build/ffmpeg-link-map-build.log",
            "--ffprobe-map-build-log", "_minimal-ffmpeg-build/ffprobe-link-map-build.log",
            "--ffmpeg-map", "_minimal-ffmpeg-build/ffmpeg-link.map",
            "--ffprobe-map", "_minimal-ffmpeg-build/ffprobe-link.map",
            "--ownership-proof", "_minimal-ffmpeg-build/link-input-ownership-proof.json",
            "--release-ffmpeg-unstripped", "_minimal-ffmpeg-build/release-unstripped/ffmpeg_g.exe",
            "--release-ffprobe-unstripped", "_minimal-ffmpeg-build/release-unstripped/ffprobe_g.exe",
            "--mapped-ffmpeg-unstripped", "_ffmpeg-source/ffmpeg_g.exe",
            "--mapped-ffprobe-unstripped", "_ffmpeg-source/ffprobe_g.exe",
            "--output-receipt", "_minimal-ffmpeg-build/link-member-proof.json"
          )
          python @memberArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Audit built helper and write proof receipt
        shell: pwsh
        run: |
          python reconstruction/gate17_ffmpeg_minimal_build_audit.py `
            --repo-root "." `
            --ffmpeg "_minimal-ffmpeg-build/ffmpeg.exe" `
            --ffprobe "_minimal-ffmpeg-build/ffprobe.exe" `
            --source-commit-file "_minimal-ffmpeg-build/source-commit.txt" `
            --source-license-file "_minimal-ffmpeg-build/COPYING.LGPLv2.1" `
            --ffmpeg-imports "_minimal-ffmpeg-build/ffmpeg-objdump.txt" `
            --ffprobe-imports "_minimal-ffmpeg-build/ffprobe-objdump.txt" `
            --output-receipt "_minimal-ffmpeg-build/build-proof.json"

      - name: Prove synthetic canonical startup roundtrip
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-03-18-14/ffmpeg-n9.0.2-22-g46d8f462ee-win64-lgpl-9.0.zip"
          $archive = Join-Path "${{ runner.temp }}" "ffmpeg-lgpl-fixture.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $roundtripArgs = @(
            "reconstruction/gate17_ffmpeg_minimal_roundtrip.py",
            "--repo-root", ".",
            "--ffmpeg", "_minimal-ffmpeg-build/ffmpeg.exe",
            "--ffprobe", "_minimal-ffmpeg-build/ffprobe.exe",
            "--build-proof", "_minimal-ffmpeg-build/build-proof.json",
            "--fixture-archive", $archive,
            "--output-receipt", "_minimal-ffmpeg-build/roundtrip-proof.json"
          )
          python @roundtripArgs

      - name: Upload exact minimal build proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate17-minimal-ffmpeg-build-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            _minimal-ffmpeg-build/ffmpeg.exe
            _minimal-ffmpeg-build/ffprobe.exe
            _minimal-ffmpeg-build/COPYING.LGPLv2.1
            _minimal-ffmpeg-build/source-commit.txt
            _minimal-ffmpeg-build/ffmpeg-objdump.txt
            _minimal-ffmpeg-build/ffprobe-objdump.txt
            _minimal-ffmpeg-build/config.mak
            _minimal-ffmpeg-build/config.log
            _minimal-ffmpeg-build/config.mak.release
            _minimal-ffmpeg-build/release-build.log
            _minimal-ffmpeg-build/ffmpeg-link-trace.log
            _minimal-ffmpeg-build/ffprobe-link-trace.log
            _minimal-ffmpeg-build/link-input-proof.json
            _minimal-ffmpeg-build/external-link-inputs.tsv
            _minimal-ffmpeg-build/link-input-owners.tsv
            _minimal-ffmpeg-build/link-input-ownership-proof.json
            _minimal-ffmpeg-build/ffmpeg-link-map-build.log
            _minimal-ffmpeg-build/ffprobe-link-map-build.log
            _minimal-ffmpeg-build/ffmpeg-link.map
            _minimal-ffmpeg-build/ffprobe-link.map
            _minimal-ffmpeg-build/link-member-proof.json
            _minimal-ffmpeg-build/toolchain-packages.txt
            _minimal-ffmpeg-build/toolchain-proof.json
            _minimal-ffmpeg-build/build-proof.json
            _minimal-ffmpeg-build/roundtrip-proof.json
          if-no-files-found: error
          retention-days: 14
