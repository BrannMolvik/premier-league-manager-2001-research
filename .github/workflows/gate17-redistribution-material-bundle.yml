name: Gate 17 integrated redistribution material bundle

on:
  pull_request:
    paths:
      - ".github/workflows/gate17-redistribution-material-bundle.yml"
      - "third_party/ffmpeg-lgpl-candidate/SOURCE-CONTRACT.json"
      - "third_party/ffmpeg-lgpl-candidate/TOOLCHAIN-CONTRACT.json"
      - "reconstruction/gate17_ffmpeg_source_snapshot.py"
      - "reconstruction/gate17_source_material_bundle.py"
      - "reconstruction/gate17_source_license_material.py"
      - "reconstruction/gate17_redistribution_material_bundle.py"
      - "reconstruction/test_gate17_redistribution_material_bundle.py"
  workflow_dispatch:

concurrency:
  group: gate17-redistribution-material-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  redistribution-material:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Run focused integrated-bundle tests
        working-directory: reconstruction
        run: python -m unittest -v test_gate17_redistribution_material_bundle

      - name: Audit all pinned material inputs
        run: |
          python reconstruction/gate17_redistribution_material_bundle.py \
            --repo-root "." \
            --output-dir "_gate17-redistribution-material" \
            --preflight-only

      - name: Check out pinned FFmpeg source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FFmpeg/FFmpeg
          ref: 46d8f462eeb87ee1f704d8c44a0ee24fca471ad1
          path: _ffmpeg-source
          fetch-depth: 1

      - name: Assemble integrated redistribution-material bundle
        run: |
          python reconstruction/gate17_redistribution_material_bundle.py \
            --repo-root "." \
            --ffmpeg-source "_ffmpeg-source" \
            --output-dir "_gate17-redistribution-material"

      - name: Verify expected integrated material counts
        run: |
          test "$(find _gate17-redistribution-material/toolchain/source-packages -maxdepth 1 -type f -name '*.src.tar.zst' | wc -l)" -eq 4
          test "$(find _gate17-redistribution-material/toolchain/license-material -type f ! -name 'license-material-manifest.json' | wc -l)" -eq 9
          test -s _gate17-redistribution-material/ffmpeg/ffmpeg-46d8f462eeb87ee1f704d8c44a0ee24fca471ad1-source.tar.xz
          test -s _gate17-redistribution-material/ffmpeg/COPYING.LGPLv2.1
          test -s _gate17-redistribution-material/THIRD-PARTY-MATERIALS.txt
          test -s _gate17-redistribution-material/redistribution-material-manifest.json

      - name: Upload integrated redistribution-material checkpoint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate17-redistribution-material-${{ github.event.pull_request.head.sha || github.sha }}
          path: _gate17-redistribution-material/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
