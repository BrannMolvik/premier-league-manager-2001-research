name: Reconstruction test suite

# The full suite is intentionally manual for gate audits and release
# verification. Do not charge each small reverse-engineering checkpoint.
on:
  # Run the full suite only for a PR changing the fragile historical
  # secondary schedule assertions or this gate-specific CI policy.
  # Keep routine main checkpoints manual to avoid duplicate CI charges.
  pull_request:
    paths:
      - ".github/workflows/reconstruction-tests.yml"
      - "reconstruction/test_competition_startup.py"
      - "reconstruction/test_match_schedule.py"
      - "reconstruction/competition_state.py"
      - "reconstruction/test_competition_state.py"
      - "reconstruction/game_state.py"
  workflow_dispatch:

concurrency:
  group: reconstruction-suite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run reconstruction tests
        working-directory: reconstruction
        run: python -m unittest discover -v
