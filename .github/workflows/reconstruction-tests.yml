name: Reconstruction test suite

# The full suite is intentionally manual for gate audits and release
# verification. Do not charge each small reverse-engineering checkpoint.
on:
  # Run the full suite only for a PR changing the fragile historical
  # secondary schedule assertions or this gate-specific CI policy.
  # Keep routine main checkpoints manual to avoid duplicate CI charges.
  pull_request:
    paths:
      - ".github/workflows/reconstruction-tests.yml"
      - "reconstruction/test_competition_startup.py"
      - "reconstruction/test_match_schedule.py"
      - "reconstruction/competition_state.py"
      - "reconstruction/test_competition_state.py"
      - "reconstruction/game_state.py"
      - "reconstruction/startup_rng.py"
      - "reconstruction/test_startup_rng.py"
      - "reconstruction/human_gameplay.py"
      - "reconstruction/test_human_gameplay.py"
      - "reconstruction/internal_save.py"
      - "reconstruction/test_internal_save.py"
      - "reconstruction/match_engine_rng.py"
      - "reconstruction/test_match_engine_rng.py"
      # Gate 15 source-backed injury availability correction shares the exact
      # DBRClub::0x405080 predicate already used by transfer decisions.
      - "reconstruction/match_injury_persistence.py"
      - "reconstruction/test_match_injury_persistence.py"
      - "reconstruction/match_postmatch.py"
      - "reconstruction/test_match_postmatch.py"
      - "reconstruction/match_simulation.py"
      - "reconstruction/test_match_simulation.py"
      - "research/FIDELITY_GAPS.md"
      # Gate13 batches may touch only presentation seams yet still import
      # large portions of the reconstructed runtime. Give those code changes
      # one full integration suite on PR, while ordinary research/docs and
      # main checkpoints remain outside the full-suite trigger.
      - "reconstruction/gate13_management_source_data.py"
      - "reconstruction/test_gate13_management_source_data.py"
      - "reconstruction/gate13_remaining_field_source_trace.py"
      - "reconstruction/test_gate13_remaining_field_source_trace.py"
      - "reconstruction/original_pmenu_presenter.py"
      - "reconstruction/test_original_pmenu_presenter.py"
      - "reconstruction/original_management_presenter.py"
      - "reconstruction/test_original_management_presenter.py"
      - "reconstruction/original_game_host.py"
      - "reconstruction/test_original_game_host.py"
      - "reconstruction/app.py"
      - "reconstruction/test_app_presentation_boundary.py"
      - "reconstruction/original_startup_media.py"
      - "reconstruction/test_original_startup_media.py"
      - "reconstruction/gate14_startup_media_convert.py"
      - "reconstruction/test_gate14_startup_media_convert.py"
      - "reconstruction/startup_media_derivatives.py"
      - "reconstruction/test_startup_media_derivatives.py"
      - "reconstruction/startup_media_playback.py"
      - "reconstruction/test_startup_media_playback.py"
      - "reconstruction/match_presentation_feed.py"
      - "reconstruction/test_match_presentation_feed.py"
      - "reconstruction/human_match_presentation.py"
      - "reconstruction/test_human_match_presentation.py"
      - "reconstruction/fastview_semantic_shell.py"
      - "reconstruction/test_fastview_semantic_shell.py"
      - "reconstruction/gate14_fastview_resource_catalog.py"
      - "reconstruction/test_gate14_fastview_resource_catalog.py"
      - "reconstruction/gate14_possession_diagram.py"
      - "reconstruction/test_gate14_possession_diagram.py"
      - "reconstruction/original_fastview_possession_resources.py"
      - "reconstruction/test_original_fastview_possession_resources.py"
      - "reconstruction/gate14_possession_figures.py"
      - "reconstruction/test_gate14_possession_figures.py"
      - "reconstruction/gate14_fastview_scores.py"
      - "reconstruction/test_gate14_fastview_scores.py"
      - "reconstruction/gate14_fastview_team.py"
      - "reconstruction/test_gate14_fastview_team.py"
      - "reconstruction/gate14_fastview_player_history.py"
      - "reconstruction/test_gate14_fastview_player_history.py"
      - "reconstruction/gate14_fastview_playerrow_snapshot.py"
      - "reconstruction/test_gate14_fastview_playerrow_snapshot.py"
      - "reconstruction/gate14_fastview_partial_surface.py"
      - "reconstruction/test_gate14_fastview_partial_surface.py"
      - "reconstruction/gate14_fastview_component_rasters.py"
      - "reconstruction/test_gate14_fastview_component_rasters.py"
      - "reconstruction/gate14_fastview_frame_plan.py"
      - "reconstruction/test_gate14_fastview_frame_plan.py"
      - "reconstruction/gate14_fastview_human_frame_plan.py"
      - "reconstruction/test_gate14_fastview_human_frame_plan.py"
      - "reconstruction/gate14_audio_bank_source_trace.py"
      - "reconstruction/test_gate14_audio_bank_source_trace.py"
      - "reconstruction/gate14_fastview_league_table.py"
      - "reconstruction/test_gate14_fastview_league_table.py"
      - "original_assets/source/FM2001_Art/FastView/**"
      - "research/GATE14_AUDIO_AND_MATCH_PRESENTATION.md"
      - "reconstruction/original_pmenu_activation.py"
      - "reconstruction/test_original_pmenu_activation.py"
      - "research/GATE14_PRESENTATION_FOUNDATION.md"
      - "reconstruction/gate16_annual_regeneration_soak.py"
      - "reconstruction/test_gate16_annual_regeneration_soak.py"
      - "research/GATE16_ANNUAL_REGENERATION_SOAK.md"
      - "reconstruction/test_gate16_multiseed_season_stress.py"
      - "research/GATE16_MULTISEED_SEASON_STRESS.md"
      - "reconstruction/gate17_release_readiness.py"
      - "reconstruction/test_gate17_release_readiness.py"
      - "reconstruction/gate17_windows_gameplay_receipts.py"
      - "reconstruction/test_gate17_windows_gameplay_receipts.py"
      - "reconstruction/gate17_clean_windows_install.py"
      - "reconstruction/test_gate17_clean_windows_install.py"
      - "reconstruction/gate17_release_evidence.py"
      - "reconstruction/test_gate17_release_evidence.py"
      - "research/GATE17_RELEASE_READINESS.md"
      - "research/RELEASE_LIMITATIONS.md"
      - "reconstruction/test_gate16_consecutive_seasons.py"
      - "research/GATE16_CONSECUTIVE_SEASONS.md"
      - "reconstruction/test_gate16_transfer_churn_stress.py"
      - "research/GATE16_TRANSFER_CHURN_STRESS.md"
      - "reconstruction/test_gate16_mixed_primary_stress.py"
      - "research/GATE16_MIXED_PRIMARY_STRESS.md"
      - "reconstruction/canonical_multiseason_audit.py"
      - "reconstruction/test_canonical_multiseason_audit.py"
      - "research/GATE16_CANONICAL_MULTISEASON_AUDIT.md"
  workflow_dispatch:

concurrency:
  group: reconstruction-suite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded original PE disassembly test dependency
        run: python -m pip install "capstone>=5,<6"
      - name: Run reconstruction tests
        working-directory: reconstruction
        run: python -m unittest discover -v
