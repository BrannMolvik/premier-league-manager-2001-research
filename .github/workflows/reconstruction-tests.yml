name: Reconstruction test suite

# The full suite is intentionally manual for gate audits and release
# verification. A PR may opt in by changing this workflow only;
# do not charge each small reverse-engineering checkpoint.
on:
  workflow_dispatch:

concurrency:
  group: reconstruction-suite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run reconstruction tests
        working-directory: reconstruction
        run: python -m unittest discover -v
