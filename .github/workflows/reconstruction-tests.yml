name: Reconstruction test suite

# The full suite is intentionally manual for gate audits and release
# verification. Do not charge each small reverse-engineering checkpoint.
on:
  # Run the full suite only for a PR changing the fragile historical
  # secondary schedule assertions or this gate-specific CI policy.
  # Keep routine main checkpoints manual to avoid duplicate CI charges.
  pull_request:
    paths:
      - ".github/workflows/reconstruction-tests.yml"
      - "reconstruction/test_competition_startup.py"
      - "reconstruction/test_match_schedule.py"
      - "reconstruction/competition_state.py"
      - "reconstruction/test_competition_state.py"
      - "reconstruction/game_state.py"
      # Gate13 batches may touch only presentation seams yet still import
      # large portions of the reconstructed runtime. Give those code changes
      # one full integration suite on PR, while ordinary research/docs and
      # main checkpoints remain outside the full-suite trigger.
      - "reconstruction/gate13_management_source_data.py"
      - "reconstruction/test_gate13_management_source_data.py"
      - "reconstruction/original_pmenu_presenter.py"
      - "reconstruction/test_original_pmenu_presenter.py"
      - "reconstruction/original_management_presenter.py"
      - "reconstruction/test_original_management_presenter.py"
      - "reconstruction/original_game_host.py"
      - "reconstruction/test_original_game_host.py"
      - "reconstruction/app.py"
      - "reconstruction/test_app_presentation_boundary.py"
      - "reconstruction/original_startup_media.py"
      - "reconstruction/test_original_startup_media.py"
      - "reconstruction/gate14_startup_media_convert.py"
      - "reconstruction/test_gate14_startup_media_convert.py"
      - "reconstruction/startup_media_derivatives.py"
      - "reconstruction/test_startup_media_derivatives.py"
      - "reconstruction/startup_media_playback.py"
      - "reconstruction/test_startup_media_playback.py"
      - "reconstruction/match_presentation_feed.py"
      - "reconstruction/test_match_presentation_feed.py"
      - "reconstruction/original_pmenu_activation.py"
      - "reconstruction/test_original_pmenu_activation.py"
      - "research/GATE14_PRESENTATION_FOUNDATION.md"
      - "reconstruction/gate16_annual_regeneration_soak.py"
      - "reconstruction/test_gate16_annual_regeneration_soak.py"
      - "research/GATE16_ANNUAL_REGENERATION_SOAK.md"
      - "reconstruction/test_gate16_multiseed_season_stress.py"
      - "research/GATE16_MULTISEED_SEASON_STRESS.md"
      - "reconstruction/gate17_release_readiness.py"
      - "reconstruction/test_gate17_release_readiness.py"
      - "research/GATE17_RELEASE_READINESS.md"
      - "research/RELEASE_LIMITATIONS.md"
      - "reconstruction/test_gate16_consecutive_seasons.py"
      - "research/GATE16_CONSECUTIVE_SEASONS.md"
      - "reconstruction/test_gate16_transfer_churn_stress.py"
      - "research/GATE16_TRANSFER_CHURN_STRESS.md"
      - "reconstruction/test_gate16_mixed_primary_stress.py"
      - "research/GATE16_MIXED_PRIMARY_STRESS.md"
      - "reconstruction/canonical_multiseason_audit.py"
      - "reconstruction/test_canonical_multiseason_audit.py"
      - "research/GATE16_CANONICAL_MULTISEASON_AUDIT.md"
  workflow_dispatch:

concurrency:
  group: reconstruction-suite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded original PE disassembly test dependency
        run: python -m pip install "capstone>=5,<6"
      - name: Run reconstruction tests
        working-directory: reconstruction
        run: python -m unittest discover -v

  playtest-build:
    name: Frozen Windows playtest package
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
      - name: Install packaging dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check "pyinstaller>=6,<7" "capstone>=5,<6"
      - name: Build source-backed Windows playtest
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name FM2001_Playtest --paths reconstruction --add-data "original_assets;original_assets" reconstruction/app.py
          if (-not (Test-Path "dist/FM2001_Playtest/FM2001_Playtest.exe")) { throw "PyInstaller output missing" }
          @"
          FM2001 GATE 13 PLAYTEST

          Frozen source commit:
          9b31feb05f4c6e239eb4c96288375217165a484e

          This package is a playtest snapshot, not a Gate 13 release.

          HOW TO RUN
          1. Extract the entire ZIP to a normal folder.
          2. Run FM2001_Playtest.exe.
          3. The port looks first for the original FM2001 installation at:
             C:\Games\FM2001
          4. If it is not there, choose your original FM2001 game folder when prompted.

          The selected folder must contain the authorized original game files,
          including Master.dat and FOOTBAL.EXE. Keep the whole playtest folder
          together because the bundled original UI resources live beside the EXE.

          PLAYTEST TARGET
          Focus on the source-backed path:
          New Game -> TeamSelect -> Management/PMenu -> Squad -> League Fixtures
          -> PMatchInfo -> League Tables.

          Some unrecovered interactions intentionally remain disabled/fail-closed.
          "@ | Set-Content -Encoding UTF8 "dist/FM2001_Playtest/PLAYTEST_README.txt"
          "9b31feb05f4c6e239eb4c96288375217165a484e" | Set-Content -Encoding ASCII "dist/FM2001_Playtest/SOURCE_COMMIT.txt"
          Compress-Archive -Path "dist/FM2001_Playtest/*" -DestinationPath "FM2001-Gate13-Playtest-9b31feb.zip" -Force
          Get-FileHash "FM2001-Gate13-Playtest-9b31feb.zip" -Algorithm SHA256 | Format-List
      - name: Upload playtest package
        uses: actions/upload-artifact@v4
        with:
          name: FM2001-Gate13-Playtest-9b31feb
          path: FM2001-Gate13-Playtest-9b31feb.zip
          if-no-files-found: error
          retention-days: 7
