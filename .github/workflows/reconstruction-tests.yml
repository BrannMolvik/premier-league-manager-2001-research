name: Reconstruction test suite

on:
  push:
    paths:
      - ".github/workflows/reconstruction-tests.yml"
      - "reconstruction/**"
  pull_request:
    paths:
      - ".github/workflows/reconstruction-tests.yml"
      - "reconstruction/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run reconstruction tests
        working-directory: reconstruction
        run: python -m unittest discover -v
