name: Reconstruction test suite

on:
  push:
    paths:
      - ".github/workflows/reconstruction-tests.yml"
      - "reconstruction/**"
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run reconstruction tests
        working-directory: reconstruction
        run: python -m unittest discover -v
