name: Windows release candidate package

on:
  pull_request:
    paths:
      - ".github/workflows/windows-package.yml"
      - ".gitattributes"
      - "reconstruction/app.py"
      - "reconstruction/test_app_package_smoke.py"
      - "reconstruction/gate13_pstartmenu_derivative.py"
      - "reconstruction/runtime_layout.py"
      - "reconstruction/original_game_host.py"
      - "reconstruction/startup_media_runtime_cache.py"
      - "reconstruction/startup_media_windows_backend.py"
      - "reconstruction/test_startup_media_runtime_cache.py"
      - "reconstruction/test_startup_media_windows_backend.py"
      - "reconstruction/gate17_package_candidate.py"
      - "reconstruction/gate17_third_party_ffmpeg.py"
      - "reconstruction/test_gate17_third_party_ffmpeg.py"
      - "reconstruction/gate17_ffmpeg_lgpl_candidate.py"
      - "reconstruction/test_gate17_ffmpeg_lgpl_candidate.py"
      - "reconstruction/gate17_ffmpeg_minimal_source_contract.py"
      - "reconstruction/test_gate17_ffmpeg_minimal_source_contract.py"
      - "reconstruction/gate17_ffmpeg_original_tgq_proof.py"
      - "reconstruction/test_gate17_ffmpeg_original_tgq_proof.py"
      - "research/GATE17_MINIMAL_FFMPEG_ORIGINAL_TGQ.md"
      - "third_party/ffmpeg-lgpl-candidate/**"
      - "research/GATE17_FFMPEG_LGPL_MIGRATION.md"
      - "third_party/ffmpeg/**"
      - "reconstruction/gate17_clean_windows_install.py"
      - "reconstruction/gate17_external_validation.py"
      - "reconstruction/test_gate17_package_candidate.py"
      - "reconstruction/test_gate17_clean_windows_install.py"
      - "reconstruction/test_gate17_external_validation.py"
      - "reconstruction/test_runtime_layout.py"
      - "original_assets/**"
  workflow_dispatch:

concurrency:
  group: windows-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package builder and bundled FFmpeg provider
        run: python -m pip install "pyinstaller>=6,<7" "imageio-ffmpeg==0.6.0"

      - name: Stage runtime FFmpeg executable
        working-directory: reconstruction
        shell: pwsh
        run: |
          python -c "from pathlib import Path; import shutil, imageio_ffmpeg; d=Path('_runtime_tools'); d.mkdir(exist_ok=True); shutil.copy2(imageio_ffmpeg.get_ffmpeg_exe(), d/'ffmpeg.exe')"
          python gate17_third_party_ffmpeg.py --ffmpeg-exe "_runtime_tools\ffmpeg.exe" --output-attestation "_runtime_tools\ffmpeg.provenance.json"
          .\_runtime_tools\ffmpeg.exe -version

      - name: Probe pinned LGPL FFmpeg migration candidate
        working-directory: reconstruction
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-03-18-14/ffmpeg-n9.0.2-22-g46d8f462ee-win64-lgpl-9.0.zip"
          $archive = Join-Path "${{ runner.temp }}" "ffmpeg-lgpl-candidate.zip"
          $receipt = Join-Path "${{ runner.temp }}" "ffmpeg-lgpl-candidate.json"
          Invoke-WebRequest -Uri $url -OutFile $archive
          python gate17_ffmpeg_lgpl_candidate.py --archive $archive --output-receipt $receipt
          Get-Content $receipt

      - name: Audit minimal FFmpeg source contract
        working-directory: reconstruction
        run: python -c "from gate17_ffmpeg_minimal_source_contract import audit_source_contract; import json; print(json.dumps(audit_source_contract('..'), indent=2, sort_keys=True))"

      - name: Run package-specific unit tests
        working-directory: reconstruction
        run: python -m unittest -v test_runtime_layout test_app_package_smoke test_app_presentation_boundary test_startup_media_runtime_cache test_startup_media_windows_backend test_gate17_package_candidate test_gate17_third_party_ffmpeg test_gate17_ffmpeg_lgpl_candidate test_gate17_ffmpeg_minimal_source_contract test_gate17_ffmpeg_original_tgq_proof test_gate17_clean_windows_install test_gate17_external_validation

      - name: Freeze one-directory Windows runtime
        working-directory: reconstruction
        run: pyinstaller --noconfirm --clean --onedir --name FM2001-Windows11 --add-data "../original_assets;original_assets" --add-data "../third_party/ffmpeg;third_party/ffmpeg" --add-data "_runtime_tools/ffmpeg.provenance.json;runtime_tools" --add-data "original_management_background_assets.json;." --add-binary "_runtime_tools/ffmpeg.exe;runtime_tools" app.py

      - name: Smoke frozen executable without user game data
        working-directory: reconstruction
        run: .\dist\FM2001-Windows11\FM2001-Windows11.exe --package-smoke

      - name: Build deterministic candidate archive and identity manifest
        working-directory: reconstruction
        shell: pwsh
        run: |
          $commit = "${{ github.event.pull_request.head.sha || github.sha }}"
          $version = "rc-$commit"
          $out = Join-Path "${{ runner.temp }}" "fm2001-release"
          python gate17_package_candidate.py `
            --dist-root "dist\FM2001-Windows11" `
            --output-dir "$out" `
            --release-version "$version" `
            --repository-commit "$commit" `
            --executable-name "FM2001-Windows11.exe"
          Get-ChildItem -Path "$out" | Format-Table Name,Length

      - name: Upload Windows release candidate
        uses: actions/upload-artifact@v4
        with:
          name: FM2001-Windows11-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}\fm2001-release\*
          if-no-files-found: error
          retention-days: 14
