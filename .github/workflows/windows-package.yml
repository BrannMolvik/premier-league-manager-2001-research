name: Windows release candidate package

on:
  pull_request:
    paths:
      - ".github/workflows/windows-package.yml"
      - "reconstruction/app.py"
      - "reconstruction/runtime_layout.py"
      - "reconstruction/original_game_host.py"
      - "reconstruction/gate17_package_candidate.py"
      - "reconstruction/gate17_clean_windows_install.py"
      - "reconstruction/gate17_external_validation.py"
      - "reconstruction/gate17_full_scope_receipt.py"
      - "reconstruction/test_gate17_package_candidate.py"
      - "reconstruction/test_gate17_clean_windows_install.py"
      - "reconstruction/test_gate17_external_validation.py"
      - "reconstruction/test_gate17_full_scope_receipt.py"
      - "research/GATE17_ORIGINAL_SCOPE_CATALOG.json"
      - "reconstruction/test_runtime_layout.py"
      - "original_assets/**"
  workflow_dispatch:

concurrency:
  group: windows-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package builder
        run: python -m pip install "pyinstaller>=6,<7"

      - name: Run package-specific unit tests
        working-directory: reconstruction
        run: python -m unittest -v test_runtime_layout test_gate17_package_candidate test_gate17_clean_windows_install test_gate17_external_validation test_gate17_full_scope_receipt

      - name: Freeze one-directory Windows runtime
        working-directory: reconstruction
        run: pyinstaller --noconfirm --clean --onedir --name FM2001-Windows11 --add-data "../original_assets;original_assets" --add-data "original_management_background_assets.json;." app.py

      - name: Smoke frozen executable without user game data
        working-directory: reconstruction
        run: .\dist\FM2001-Windows11\FM2001-Windows11.exe --package-smoke

      - name: Build deterministic candidate archive and identity manifest
        working-directory: reconstruction
        shell: pwsh
        run: |
          $commit = "${{ github.event.pull_request.head.sha || github.sha }}"
          $version = "rc-$commit"
          $out = Join-Path "${{ runner.temp }}" "fm2001-release"
          python gate17_package_candidate.py `
            --dist-root "dist\FM2001-Windows11" `
            --output-dir "$out" `
            --release-version "$version" `
            --repository-commit "$commit" `
            --executable-name "FM2001-Windows11.exe"
          Get-ChildItem -Path "$out" | Format-Table Name,Length

      - name: Upload Windows release candidate
        uses: actions/upload-artifact@v4
        with:
          name: FM2001-Windows11-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}\fm2001-release\*
          if-no-files-found: error
          retention-days: 14
