name: One-shot reconstruction source export

on:
  push:
    paths:
      - ".github/workflows/export-reconstruction-source.yml"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-artifact@v4
        with:
          name: fm2001-reconstruction-source
          path: reconstruction/
          retention-days: 1
