name: Temporary Gate 14 font staging

on:
  push:
    branches:
      - "chatgpt/gate14-font-stage"

permissions:
  contents: write

jobs:
  stage-exact-font:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "chatgpt/gate14-font-stage"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct and verify exact authorized font
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          source = Path("research/tmp_gate14_zurich18_font.gz.b64")
          lines = source.read_text(encoding="ascii").splitlines()
          expected_line_hashes = (
              "9f2eebf4b135bbad8f155b96fbf8fe312e51f9ebe3582d1eb7f2a01154c7e52f",
              "4f5ae04fe0b098196d6a6bf700fd45300287c29f728af19505eae6bec7f0bc78",
              "655073d9a1d2bd705976307e3b186eb0ff0e21a4c1726605e8f1fe44220c2557",
              "337079bccd2e0c5c7a3096fa5b2fa9b45af96bc052b07eab494c4a770bc61b9a",
          )
          actual_line_hashes = tuple(
              hashlib.sha256(line.encode("ascii")).hexdigest() for line in lines
          )
          if tuple(map(len, lines)) != (2751, 2751, 2751, 2751):
              raise SystemExit(f"payload line lengths drifted: {tuple(map(len, lines))}")
          if actual_line_hashes != expected_line_hashes:
              expected_line3_slice_hashes = (
                  "f08f8db5b665337b7f0a8a65d9d83935ce175125acd8bc952a06dcdf4eac8a41",
                  "46f3a37e28c0bce85a09eaedda2daac6a98b0ded3daef8648e3a946f3bea7166",
                  "191341eb482d0bf90c4d7233645d580ef1b7e5c775c6b10833ea796bb6082696",
                  "150d5f062734500aefd908b7edb0b409316870bbb9be8b1acd5d77c433e6d7d9",
                  "789567b9f8b65a67ade73d77e1c57fa5b430b55af80e4883e11c8f0d9688c2da",
                  "37bc48e5a2b6a89fb74c0dcee0a8cf252d99f91b10b0b73a5e50d73143146db0",
                  "8611056c456db1ee374ccbe6d75cd2ec378953cfc24b6250eaa90176d1149d6d",
                  "1b6fda8357a92b8adbdd1c77f0bf3eb2399bcd84e1fa1d87707f87084554b2c1",
                  "2c7dad31c465201aaf77bf15775cee3daf7fe6a272112bf8ae1c952ca584cc39",
              )
              line3_slices = tuple(
                  lines[2][offset:offset + 306]
                  for offset in range(0, len(lines[2]), 306)
              )
              actual_line3_slice_hashes = tuple(
                  hashlib.sha256(part.encode("ascii")).hexdigest()
                  for part in line3_slices
              )
              raise SystemExit(
                  "payload line hashes drifted; line3 slices: "
                  + repr(tuple(zip(
                      actual_line3_slice_hashes,
                      expected_line3_slice_hashes,
                  )))
              )
          encoded = "".join(lines)
          compressed = base64.b64decode(encoded, validate=True)
          data = gzip.decompress(compressed)

          expected_size = 79_734
          expected_sha256 = "968936a5f5e42c4dd321f0a1096a8668c8f9ca3bd0b86243b585190969c1b71a"
          actual_sha256 = hashlib.sha256(data).hexdigest()
          if len(data) != expected_size:
              raise SystemExit(f"font size mismatch: {len(data)} != {expected_size}")
          if actual_sha256 != expected_sha256:
              raise SystemExit(f"font sha256 mismatch: {actual_sha256}")

          output = Path("original_assets/source/Fonts/Zurich_XCn_BT_18pixel.fnt")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_bytes(data)
          print(f"verified {output}: {len(data)} bytes {actual_sha256}")
          PY
      - name: Commit exact binary font to staging branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add original_assets/source/Fonts/Zurich_XCn_BT_18pixel.fnt
          git diff --cached --exit-code && exit 0 || true
          git commit -m "Gate 14: stage exact Zurich 18px source font"
          git push origin HEAD:chatgpt/gate14-font-stage
