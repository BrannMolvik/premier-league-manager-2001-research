name: Gate 17 FFmpeg source snapshot

on:
  pull_request:
    paths:
      - ".github/workflows/gate17-ffmpeg-source-snapshot.yml"
      - "third_party/ffmpeg-lgpl-candidate/SOURCE-CONTRACT.json"
      - "reconstruction/gate17_ffmpeg_source_snapshot.py"
      - "reconstruction/test_gate17_ffmpeg_source_snapshot.py"
      - "reconstruction/gate17_ffmpeg_minimal_source_contract.py"
  workflow_dispatch:

concurrency:
  group: gate17-ffmpeg-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact port candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Run focused snapshot tests
        working-directory: reconstruction
        run: python -m unittest -v test_gate17_ffmpeg_source_snapshot

      - name: Audit snapshot contract
        run: |
          python reconstruction/gate17_ffmpeg_source_snapshot.py \
            --repo-root "." \
            --output-dir "_gate17-ffmpeg-source" \
            --preflight-only

      - name: Check out pinned FFmpeg source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FFmpeg/FFmpeg
          ref: 46d8f462eeb87ee1f704d8c44a0ee24fca471ad1
          path: _ffmpeg-source
          fetch-depth: 1

      - name: Build deterministic exact-source snapshot
        run: |
          python reconstruction/gate17_ffmpeg_source_snapshot.py \
            --repo-root "." \
            --ffmpeg-source "_ffmpeg-source" \
            --output-dir "_gate17-ffmpeg-source"

      - name: Upload exact FFmpeg source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate17-ffmpeg-source-snapshot-${{ github.event.pull_request.head.sha || github.sha }}
          path: _gate17-ffmpeg-source/
          if-no-files-found: error
          retention-days: 14
