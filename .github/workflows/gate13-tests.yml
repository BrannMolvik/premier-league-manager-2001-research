name: Gate 13 presentation source tests

# Run on explicit verified milestones, or when integration is proposed.
# Normal main-branch checkpoints must not launch duplicate CI.
on:
  pull_request:
    paths:
      - ".github/workflows/gate13-tests.yml"
      - "reconstruction/front_end_state.py"
      - "reconstruction/front_end_session.py"
      - "reconstruction/test_front_end_session.py"
      - "reconstruction/gate13_*.py"
      - "original_assets/source/reused_art/generic/main_menu_windows_buttons.png"
      - "original_assets/source/FM2001_Art/Generic/GenericButtonsAndBars/*scroll_end.444"
      - "reconstruction/ea444_header.py"
      - "reconstruction/ea444_bits.py"
      - "reconstruction/ea444_tables.py"
      - "reconstruction/ea444_coefficients.py"
      - "reconstruction/ea444_quantization.py"
      - "reconstruction/test_ea444_quantization.py"
      - "reconstruction/ea444_quantized_block.py"
      - "reconstruction/test_ea444_quantized_block.py"
      - "reconstruction/ea444_inverse_transform.py"
      - "reconstruction/test_ea444_inverse_transform.py"
      - "reconstruction/ea444_decoder.py"
      - "reconstruction/test_ea444_decoder.py"
      - "reconstruction/test_ea444_coefficients.py"
      - "reconstruction/test_ea444_tables.py"
      - "reconstruction/test_ea444_bits.py"
      - "reconstruction/test_ea444_header.py"
      - "reconstruction/original_menu_assets.py"
      - "reconstruction/original_front_end_layout.py"
      - "reconstruction/original_front_end_input.py"
      - "reconstruction/test_original_front_end_input.py"
      - "reconstruction/test_original_front_end_layout.py"
      - "reconstruction/test_original_menu_assets.py"
      - "reconstruction/ea_language_strings.py"
      - "reconstruction/ea_font.py"
      - "reconstruction/test_ea_font.py"
      - "reconstruction/original_pstartmenu_labels.py"
      - "reconstruction/original_button_frames.py"
      - "reconstruction/original_pstartmenu_resources.py"
      - "reconstruction/original_teamselect_resources.py"
      - "reconstruction/original_teamselect_native.py"
      - "reconstruction/test_original_teamselect_native.py"
      - "reconstruction/original_scouting_resources.py"
      - "reconstruction/test_original_scouting_resources.py"
      - "reconstruction/original_squad_resources.py"
      - "reconstruction/test_original_squad_resources.py"
      - "reconstruction/original_squad_presenter.py"
      - "reconstruction/test_original_squad_presenter.py"
      - "reconstruction/original_management_shell.py"
      - "reconstruction/test_original_management_shell.py"
      - "reconstruction/original_management_navigation.py"
      - "reconstruction/test_original_management_navigation.py"
      - "reconstruction/original_management_presenter.py"
      - "reconstruction/test_original_management_presenter.py"
      - "reconstruction/original_league_fixtures_resources.py"
      - "reconstruction/test_original_league_fixtures_resources.py"
      - "reconstruction/original_league_fixtures_presenter.py"
      - "reconstruction/test_original_league_fixtures_presenter.py"
      - "reconstruction/original_league_tables_resources.py"
      - "reconstruction/test_original_league_tables_resources.py"
      - "reconstruction/original_league_tables_presenter.py"
      - "reconstruction/test_original_league_tables_presenter.py"
      - "reconstruction/original_pmatchinfo_resources.py"
      - "reconstruction/test_original_pmatchinfo_resources.py"
      - "reconstruction/original_pmenu_chrome.py"
      - "reconstruction/test_original_pmenu_chrome.py"
      - "reconstruction/original_teamselect_hierarchy_art.py"
      - "reconstruction/test_original_teamselect_hierarchy_art.py"
      - "reconstruction/original_first_screen_presenter.py"
      - "reconstruction/original_live_debug_view.py"
      - "reconstruction/original_hierarchy_debug_inspector.py"
      - "reconstruction/test_original_hierarchy_debug_inspector.py"
      - "reconstruction/gate13_original_first_screen_viewer.py"
      - "reconstruction/test_gate13_original_first_screen_viewer.py"
      - "reconstruction/gate13_management_source_data.py"
      - "reconstruction/app.py"
      - "reconstruction/test_app_presentation_boundary.py"
      - "reconstruction/test_gate13_presentation_separation.py"
      - "reconstruction/test_gate13_management_source_data.py"
      - "reconstruction/test_original_first_screen_presenter.py"
      - "reconstruction/gate13_first_screen_selection.py"
      - "reconstruction/gate13_first_screen_manifest_readiness.py"
      - "reconstruction/test_gate13_first_screen_manifest_readiness.py"
      - "reconstruction/test_gate13_first_screen_selection.py"
      - "research/GATE13_FIRST_SCREEN_EXACT_PATHS.txt"
      - "reconstruction/test_original_teamselect_resources.py"
      - "reconstruction/test_original_pstartmenu_resources.py"
      - "reconstruction/test_original_button_frames.py"
      - "reconstruction/test_original_pstartmenu_labels.py"
      - "reconstruction/test_ea_language_strings.py"
      - "reconstruction/iso9660_reader.py"
      - "reconstruction/test_front_end_state.py"
      - "reconstruction/test_gate13_*.py"
      - "reconstruction/gate13_button_vtable_xref_candidates.py"
      - "reconstruction/gate13_button_rtti_candidates.py"
      - "reconstruction/gate13_original_source_audit.py"
      - "reconstruction/test_iso9660_reader.py"
  workflow_dispatch:

concurrency:
  group: gate13-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate13:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded original PE disassembly test dependency
        run: python -m pip install "capstone>=5,<6"
      - name: Compile temporary prototype after presentation-boundary changes
        working-directory: reconstruction
        run: python -m py_compile app.py gate13_management_source_data.py original_management_presenter.py original_league_fixtures_presenter.py original_league_tables_presenter.py
      - name: Run focused Gate 13 tests
        working-directory: reconstruction
        run: |
          python -m unittest -v \
            test_front_end_state \
            test_front_end_session \
            test_ea_language_strings \
            test_ea_font \
            test_original_pstartmenu_labels \
            test_original_button_frames \
            test_original_pstartmenu_resources \
            test_original_teamselect_resources \
            test_original_teamselect_native \
            test_original_scouting_resources \
            test_original_squad_resources \
            test_original_squad_presenter \
            test_original_management_shell \
            test_original_management_navigation \
            test_original_management_presenter \
            test_original_league_fixtures_resources \
            test_original_league_fixtures_presenter \
            test_original_league_tables_resources \
            test_original_league_tables_presenter \
            test_original_pmatchinfo_resources \
            test_original_pmenu_chrome \
            test_original_teamselect_hierarchy_art \
            test_original_first_screen_presenter \
            test_ea444_header \
            test_ea444_bits \
            test_ea444_tables \
            test_ea444_coefficients \
            test_ea444_quantization \
            test_ea444_quantized_block \
            test_ea444_inverse_transform \
            test_ea444_decoder \
            test_original_menu_assets \
            test_original_front_end_layout \
            test_original_front_end_input \
            test_gate13_asset_import \
            test_gate13_first_screen_selection \
            test_gate13_first_screen_manifest_readiness \
            test_gate13_button_source_trace \
            test_gate13_button_vtable_xref_candidates \
            test_gate13_button_rtti_candidates \
            test_gate13_squad_source_trace \
            test_gate13_original_source_audit \
            test_gate13_original_pixel_preview \
            test_gate13_original_first_screen_viewer \
            test_gate13_windows_first_screen_audit \
            test_gate13_management_source_data \
            test_app_presentation_boundary \
            test_gate13_presentation_separation \
            test_original_hierarchy_debug_inspector \
            test_gate13_catalog_query \
            test_gate13_management_catalog_audit \
            test_gate13_source_inventory \
            test_iso9660_reader
