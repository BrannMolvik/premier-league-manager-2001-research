            test_gate13_windows_first_screen_audit \
            test_gate13_management_source_data \
            test_app_presentation_boundary \
            test_gate13_presentation_separation \
            test_original_hierarchy_debug_inspector \
            test_gate13_catalog_query \
            test_gate13_management_catalog_audit \
            test_gate13_source_inventory \
            test_iso9660_reader

      - name: Generate canonical PStartMenu derivative twice
        working-directory: reconstruction
        run: |
          python gate13_pstartmenu_derivative.py \
            --repo-root .. \
            --output-dir "$RUNNER_TEMP/pstartmenu-a"
          python gate13_pstartmenu_derivative.py \
            --repo-root .. \
            --output-dir "$RUNNER_TEMP/pstartmenu-b"
          cmp "$RUNNER_TEMP/pstartmenu-a/manifest.json" "$RUNNER_TEMP/pstartmenu-b/manifest.json"
          cmp "$RUNNER_TEMP/pstartmenu-a/payload.bin.xz" "$RUNNER_TEMP/pstartmenu-b/payload.bin.xz"
          cmp "$RUNNER_TEMP/pstartmenu-a/manifest.json" "../original_assets/converted/pstartmenu-v1/manifest.json"
          cmp "$RUNNER_TEMP/pstartmenu-a/payload.bin.xz" "../original_assets/converted/pstartmenu-v1/payload.bin.xz"
          test "$(sha256sum "$RUNNER_TEMP/pstartmenu-a/manifest.json" | cut -d' ' -f1)" = "cc541cac0e844abdb7539627ea68a982288c0ba735a6bf91c84d3c502961877e"
          test "$(sha256sum "$RUNNER_TEMP/pstartmenu-a/payload.bin.xz" | cut -d' ' -f1)" = "2428510481442c5334bbdce806bd9c9919ce1a59f1d321c536432d5501199697"

      - name: Upload verified PStartMenu derivative
        uses: actions/upload-artifact@v4
        with:
          name: gate13-pstartmenu-derivative
