  workflow_dispatch:
    inputs:
      native_mute_build_only:
        description: Build the harmless x86 mute self-test with MSVC/SDK; never execute or sign it
        type: boolean
        required: false
        default: false

concurrency:
  group: gate13-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate13:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.native_mute_build_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded original PE disassembly test dependency
        run: python -m pip install "capstone>=5,<6"
      - name: Compile temporary prototype after presentation-boundary changes
        working-directory: reconstruction
        run: python -m py_compile app.py gate13_management_source_data.py original_management_presenter.py original_management_header.py original_league_fixtures_presenter.py original_league_tables_presenter.py original_pmatchinfo_presenter.py original_pmatchinfo_art.py original_squad_top_controls.py
