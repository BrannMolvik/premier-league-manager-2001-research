name: Recovery source bundle

on:
  push:
    paths:
      - ".github/workflows/recovery-source-bundle.yml"

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: reconstruction-source
          path: reconstruction/
          if-no-files-found: error
          retention-days: 1
