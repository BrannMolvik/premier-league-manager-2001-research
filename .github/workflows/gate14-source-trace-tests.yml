name: Gate 14 private-source tracer regression

on:
  pull_request:
    paths:
      - "reconstruction/gate14_fastview_font_global_source_trace.py"
      - "reconstruction/test_gate14_fastview_font_global_source_trace.py"
      - ".github/workflows/gate14-source-trace-tests.yml"
  workflow_dispatch:

concurrency:
  group: gate14-source-trace-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify asset-free source-trace tests
        working-directory: reconstruction
        run: python -m unittest -v test_gate14_fastview_font_global_source_trace
