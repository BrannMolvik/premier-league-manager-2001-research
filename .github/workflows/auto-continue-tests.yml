name: FM2001 auto-continue watchdog tests

# The extension is checked on pull requests, not on each intermediate push.
on:
  pull_request:
    paths:
      - "tools/auto_continue/**"
      - ".github/workflows/auto-continue-tests.yml"
  workflow_dispatch:

concurrency:
  group: auto-continue-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check extension JavaScript syntax
        run: |
          node --check tools/auto_continue/chrome-extension/background.js
          node --check tools/auto_continue/chrome-extension/content.js
      - name: Run watchdog behavior tests
        run: node --test tools/auto_continue/tests/*.test.cjs
