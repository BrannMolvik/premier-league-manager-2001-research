name: Audit Actions artifact storage

on:
  push:
    paths:
      - ".github/workflows/audit-artifact-storage.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inventory live artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.id, .name, .size_in_bytes, .created_at] | @tsv' \
            > /tmp/artifacts.tsv

          count=$(wc -l < /tmp/artifacts.tsv)
          bytes=$(awk -F '\t' '{sum += $3} END {printf "%.0f", sum+0}' /tmp/artifacts.tsv)
          echo "LIVE_ARTIFACT_COUNT=$count"
          echo "LIVE_ARTIFACT_BYTES=$bytes"
          echo "LIVE_ARTIFACT_MB=$(awk -v b="$bytes" 'BEGIN {printf "%.3f", b/1000000}')"
          echo "--- BY NAME ---"
          awk -F '\t' '{count[$2]++; bytes[$2]+=$3} END {for (n in count) printf "%s\t%d\t%.0f\t%.3f MB\n", n, count[n], bytes[n], bytes[n]/1000000}' /tmp/artifacts.tsv | sort
          echo "--- ALL LIVE ARTIFACTS ---"
          cat /tmp/artifacts.tsv
